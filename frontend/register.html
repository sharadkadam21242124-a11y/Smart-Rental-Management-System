<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Smart Rental Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="fa-solid fa-key"></i></div>
        <span>Smart Rental</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="nav-link text-white small"><i class="fa-solid fa-right-to-bracket me-1"></i>Existing User? Sign In</a>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <div class="custom-card p-4 p-md-5 bg-white shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-user-plus"></i>
              </div>
              <h3 class="fw-bold mb-1">Create Customer Account</h3>
              <p class="text-muted small">Join thousands of verified renters across India</p>
            </div>

            <div id="regAlert" class="alert alert-danger d-none py-2 small mb-4"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Full Legal Name *</label>
                  <input type="text" class="form-control" id="regName" required placeholder="e.g. Vikram Malhotra">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Email Address *</label>
                  <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Mobile Phone (+91) *</label>
                  <input type="tel" class="form-control" id="regPhone" required placeholder="+91 98765 43210">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">National ID / Aadhaar Number</label>
                  <input type="text" class="form-control" id="regIdProof" placeholder="AADHAAR-XXXXXXXXXXXX">
                </div>

                <div class="col-12">
                  <label class="form-label small fw-semibold">Residential Delivery Address *</label>
                  <textarea class="form-control" id="regAddress" rows="2" required placeholder="Flat / House No, Landmark, City, State, PIN"></textarea>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Driving License Number (Optional)</label>
                  <input type="text" class="form-control" id="regDl" placeholder="DL-XXXXXXXXXXXXXXX">
                </div>
                <div class="col-md-6"></div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Password *</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="regPassword" required placeholder="Min 6 characters">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('regPassword', this)"><i class="fa-solid fa-eye"></i></button>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Confirm Password *</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="regConfirmPassword" required placeholder="Re-enter password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('regConfirmPassword', this)"><i class="fa-solid fa-eye"></i></button>
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" id="regBtn" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                    <span id="regBtnText">Complete Registration</span>
                    <span id="regSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                  </button>
                </div>
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="text-muted small mb-0">Already registered? <a href="login.html" class="fw-semibold text-primary">Login to your account</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const idProof = document.getElementById('regIdProof').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const dl = document.getElementById('regDl').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;

      const alertBox = document.getElementById('regAlert');
      const btn = document.getElementById('regBtn');
      const btnText = document.getElementById('regBtnText');
      const spinner = document.getElementById('regSpinner');

      alertBox.classList.add('d-none');

      if (password !== confirmPass) {
        alertBox.textContent = 'Passwords do not match. Please verify.';
        alertBox.classList.remove('d-none');
        return;
      }
      if (password.length < 6) {
        alertBox.textContent = 'Password must be at least 6 characters.';
        alertBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btnText.classList.add('d-none');
      spinner.classList.remove('d-none');

      try {
        const payload = {
          full_name: name,
          email: email,
          phone: phone,
          address: address,
          id_proof_number: idProof,
          driving_license_number: dl,
          password: password
        };

        const res = await API.post('/register', payload);
        if (res.success && res.token) {
          API.setToken(res.token);
          API.setUser({
            email: email,
            role: 'customer',
            full_name: name
          });

          showToast('Registration successful! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'customer-dashboard.html';
          }, 800);
        } else {
          throw new Error(res.error || 'Registration failed');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Error completing registration. Email may already be in use.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
