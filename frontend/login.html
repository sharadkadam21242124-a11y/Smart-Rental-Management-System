<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Rental Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="fa-solid fa-key"></i></div>
        <span>Smart Rental</span>
      </a>
      <div class="ms-auto">
        <a href="index.html" class="nav-link text-white small"><i class="fa-solid fa-arrow-left me-1"></i>Back to Home</a>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="custom-card p-4 p-md-5 bg-white shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-lock"></i>
              </div>
              <h3 class="fw-bold mb-1">Account Login</h3>
              <p class="text-muted small">Sign in to manage your rentals, bookings and payments</p>
            </div>

            <!-- Pre-filled Demo Logins for Quick Testing -->
            <div class="alert alert-info py-2 px-3 small mb-4">
              <strong>Quick Demo Credentials:</strong><br>
              <span class="d-block mt-1">Admin: <code>admin@smartrental.com</code> / <code>Password@123</code></span>
              <span class="d-block">Customer: <code>aarav.sharma@gmail.com</code> / <code>Password@123</code></span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com" value="aarav.sharma@gmail.com">
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label class="form-label small fw-semibold">Password</label>
                </div>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-key text-muted"></i></span>
                  <input type="password" class="form-control" id="loginPassword" required placeholder="Enter password" value="Password@123">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('loginPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>

              <div id="loginAlert" class="alert alert-danger d-none py-2 small mb-3"></div>

              <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="text-muted small mb-0">Don't have an account yet? <a href="register.html" class="fw-semibold text-primary">Register Here</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alertBox = document.getElementById('loginAlert');
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btnText.classList.add('d-none');
      spinner.classList.remove('d-none');

      try {
        const res = await API.post('/login', { email, password });
        if (res.success && res.token) {
          API.setToken(res.token);
          API.setUser(res.user);
          showToast(`Welcome back, ${res.user.full_name || 'User'}!`, 'success');

          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'customer-dashboard.html';
            }
          }, 600);
        } else {
          throw new Error(res.error || 'Login failed.');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
